<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홍보 디자인 | 드림국제교류센터</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#172921;font:16px/1.55 "Malgun Gothic",sans-serif}header,main{max-width:1160px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;border-bottom:1px solid #dbe1da}a{color:#215c45}h1{font-size:clamp(30px,5vw,52px);margin:0}h2{font-size:19px;margin:0 0 10px}p{margin:6px 0 15px}.grid{display:grid;grid-template-columns:minmax(280px,370px) minmax(0,1fr);gap:20px}.panel{background:white;border:1px solid #dbe1da;border-radius:16px;padding:20px;margin-top:16px}label{display:block;margin:10px 0;font-weight:600}input,select,textarea,button{font:inherit}input:not([type=color]),select,textarea{width:100%;padding:9px;border:1px solid #aebbb3;border-radius:7px}input[type=color]{display:block;width:100%;height:36px}textarea{resize:vertical}button{padding:9px 14px;border:1px solid #245b45;border-radius:8px;background:#245b45;color:white;cursor:pointer}button.secondary{background:white;color:#245b45}button:disabled{opacity:.55;cursor:default}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}summary{cursor:pointer;color:#215c45;font-weight:700}.preview{position:sticky;top:15px;align-self:start}.stage{background:#ebefea;border-radius:10px;padding:12px;display:grid;place-items:center;min-height:220px}.stage canvas{display:block;max-width:100%;max-height:65vh;height:auto;width:auto;object-fit:contain}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.hint{color:#4c5c52;font-size:14px}@media(max-width:730px){.grid{grid-template-columns:1fr}.preview{position:static}}
</style>
<header><strong>드림국제교류센터</strong><a href="index.html">센터 홈페이지</a></header>
<main>
<h1>홍보 디자인</h1>
<p>만들 자료를 고르고, 표준디자인을 선택한 뒤 행사 내용을 입력하세요.</p>
<div class="grid">
<div>
<section class="panel"><h2>1. 만들 자료 선택</h2><label for="kind">자료 종류</label><select id="kind"><option value="ppt">PPT</option><option value="poster">포스터</option><option value="landing">랜딩페이지</option></select></section>
<section class="panel"><h2>2. 표준디자인 선택</h2><label for="template">디자인</label><select id="template"></select>
<details><summary>새 표준디자인 등록</summary><p class="hint">현재 자료 종류에 색상과 정렬을 저장합니다.</p>
<form id="register"><label>디자인 이름<input name="name" maxlength="32" required></label>
<div class="colors"><label>배경<input name="bg" type="color"></label><label>글자<input name="fg" type="color"></label><label>강조<input name="accent" type="color"></label></div>
<label>정렬<select name="align"><option value="left">왼쪽</option><option value="center">가운데</option></select></label>
<button class="secondary">표준디자인 저장</button></form></details></section>
<section class="panel"><h2>3. 행사 내용 입력</h2><form id="content">
<label>제목<input name="title" maxlength="60" required placeholder="예: 한국문화 체험의 날"></label>
<label>날짜<input name="date" maxlength="60" placeholder="예: 12월 5일 오후 2시"></label>
<label>장소<input name="place" maxlength="60" placeholder="예: 경복궁"></label>
<label>설명<textarea name="description" maxlength="180" rows="3" placeholder="어떤 행사인지 짧게 적어 주세요."></textarea></label>
</form></section>
</div>
<section class="panel preview"><h2>미리보기</h2><div class="stage"><canvas id="art" aria-label="홍보 자료 미리보기"></canvas></div><div class="actions"><button id="download" disabled>다운로드</button><span id="status" class="hint" role="status"></span></div><p class="hint" id="help"></p></section>
</div></main>
<script src="design.js"></script>
</html>
