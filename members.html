<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원관리 | 드림국제교류센터</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#142e39;font:16px/1.6 "Malgun Gothic",sans-serif}main{width:min(860px,92%);margin:36px auto}section{background:white;border:1px solid #dcded3;border-radius:16px;padding:22px;margin:16px 0}h1,h2{margin:0 0 12px}a{color:#176b65}label{display:block;font-weight:600}input,select,button{font:inherit;padding:8px;border-radius:7px;border:1px solid #adbcb9}input,select{display:block;width:100%;margin-bottom:12px}button{background:#176b65;color:white;cursor:pointer}button:disabled{opacity:.65}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid #ddd;padding:12px 0}.row span{flex:1;overflow-wrap:anywhere}.delete{background:#fff;color:#872c2c}dialog{border:1px solid #adbcb9;border-radius:12px;max-width:90vw}dialog button{margin-right:8px}
</style></head><body><main>
<a href="admin.html">← 활동사진 관리 및 로그인</a>
<h1>회원관리</h1>
<p id="memberMessage" role="status">관리자 권한을 확인하고 있습니다.</p>
<div id="memberControls" hidden>
<section><h2>회원 등록</h2>
<form id="createMember"><div class="fields">
<label>이름<input name="name" maxlength="60" required></label>
<label>아이디<input name="username" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,31}" maxlength="32" required></label>
<label>전화번호 (선택)<input name="phone" type="tel" maxlength="25" autocomplete="off" placeholder="010-1234-5678"></label>
<label>초기 비밀번호<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<label>회원 등급<select name="role"><option value="general">일반회원 · 사진 보기</option><option value="regular">정회원 · 사진 보기 및 등록</option></select></label>
</div><p>아이디는 영문·숫자로 시작하는 3~32자입니다. 초기 비밀번호는 12자 이상 입력하세요.</p><button>회원 등록</button></form></section>
<section><h2>회원 목록</h2><div id="members"></div></section>
</div>
<dialog id="phoneDialog"><form id="editPhone"><label>전화번호<input name="phone" type="tel" maxlength="25"></label><button>저장</button><button id="cancelPhone" type="button">취소</button></form></dialog>
<dialog id="deleteDialog"><form method="dialog"><p id="deleteMessage"></p><button value="cancel" autofocus>취소</button><button class="delete" value="delete">회원 삭제</button></form></dialog>
</main><script src="activity.js"></script><script src="members.js"></script></body></html>
