<header><div class="wrap bar"><a class="brand" href="#home"><span class="logo" aria-hidden="true">✦</span><span id="brand"></span></a><nav id="nav"></nav><button id="lang" class="lang" type="button"></button></div></header><main id="main"></main><footer><div class="wrap" id="foot"></div></footer>
<script>
const main=document.querySelector('#main');
let english=false;
let draft={name:'',contact:'',program:''}, checked=false;
const t=(ko,en)=>english?en:ko;
const menu={about:['센터 소개','About'],programs:['프로그램','Programs'],chapel:['국제채플','International Chapel'],news:['소식·일정','News & Events'],join:['함께하기','Get Involved'],contact:['문의·오시는 길','Contact & Directions']};
const programs={
 korean:['한국어 회화·글쓰기','Korean Conversation & Writing','일상 대화를 연습하고 짧은 글을 함께 써 봅니다.','Practice everyday conversation and work on short pieces of writing together.'],
 living:['한국 생활 안내','Life in Korea','대전에서의 생활과 학교 적응에 필요한 정보를 나눕니다.','Share practical information about student life and getting settled in Daejeon.'],
 culture:['문화교류','Cultural Exchange','명절과 음식을 나누고 함께 여행하며 서로의 문화를 배웁니다.','Share holiday traditions and food, take trips and learn about each other’s cultures.'],
 campus:['캠퍼스 만남','Campus Meetups','대전 지역 캠퍼스에서 학생들과 만나 교류합니다.','Meet fellow students on campuses around Daejeon.'],
 chapel:['국제채플','International Chapel','예배, 소그룹, 성경공부에 자율적으로 참여할 수 있습니다.','You are welcome to join worship, small groups and Bible study. Participation is optional.']
};
const name=(id)=>t(...programs[id].slice(0,2));
const desc=(id)=>t(...programs[id].slice(2));
const verify=()=>t('확인 필요','To be confirmed');
const openToAll=()=>t('한국어와 문화교류 프로그램은 종교와 관계없이 참여할 수 있습니다.','Korean language and cultural exchange programs are open to people of all faiths and none.');
const first=()=>t('첫 방문 문의','Ask about a first visit');

const section=(title,body)=>'<section class="wrap section"><h2>'+title+'</h2>'+body+'</section>';
const photo=(caption)=>'<figure><div class="photo"><div><b>'+t('활동 사진 준비 중','Activity photo pending')+'</b><small>'+t('게시 동의 확인 후 삽입','Photo will be added after publication consent is confirmed')+'</small></div></div><figcaption>'+caption+'</figcaption></figure>';
const facts=(items)=>'<dl>'+items.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>';
// Set status to open or closed after the event details are verified.
const events={};
function details(id){
 const event=events[id]||{};
 const status=event.status||'pending';
 const label={open:t('모집 중','Open'),closed:t('마감','Closed'),pending:t('일정 미정','Schedule pending')}[status];
 const action=status==='closed'?'<button class="btn alt" disabled>'+label+'</button>':button('visit/'+id,status==='open'?t('참가 신청','Register'):t('다음 일정 문의','Ask about the next date'));
 return '<p>'+desc(id)+'</p>'+(['korean','culture'].includes(id)?'<p>'+openToAll()+'</p>':'')+
 '<div class="card"><span class="tag">'+label+'</span>'+facts([
 [t('대상','Who can join'),t('대전 지역 국제 유학생','International students in Daejeon')],
 [t('날짜','Date'),event.date?.[+english]||verify()],[t('장소','Venue'),event.venue?.[+english]||verify()],
 [t('진행 언어','Language'),event.language?.[+english]||verify()],[t('비용','Cost'),event.cost?.[+english]||verify()],
 [t('모집 상태','Registration'),label]])+'<div class="actions">'+action+'</div></div>';
}
const aboutItems=[["국제채플","International Chapel","예배·소그룹·성경공부에 자율적으로 참여할 수 있습니다.","Worship, small groups and Bible study are optional.","chapel","채플 안내","Explore the chapel"],["이사회","Board of Directors","2026년 4월 이사회 모임 기록을 확인할 수 있습니다. 이사진과 운영 정보는 확인 중입니다.","See the April 2026 board meeting album. Board membership and operating details are pending.","","",""],["매칭 프로그램","Matching Program","유학생과 한국어 대화 파트너를 연결하는 프로그램입니다. 모집 일정과 운영 방식은 확인 중입니다.","Connect with a Korean conversation partner. Recruitment dates and matching details are pending.","visit/matching","매칭 문의","Ask about matching"],["후원하기","Support Us","센터 활동을 지원하고 싶으시면 후원 문의를 이용해 주세요. 공식 후원 방법은 확인 중입니다.","Use the inquiry form to ask about supporting the center. Official donation details are pending.","visit/support","후원 문의","Ask about donations"],["해외교류(의료·선교)","International Exchange (Healthcare & Missions)","의료와 선교 분야의 해외 교류를 소개합니다.","Explore international exchange in healthcare and missions.","exchange","해외교류(의료·선교)","International Exchange (Healthcare & Missions)"]];
const aboutAlbums=[["2025 국제채플","2025 International Chapel","PTeKMvXY-gmBngxjdtN1rXtOyGY-lTcPys42s"],["2026년 4월 이사회 모임","April 2026 Board Meeting","PyJKHqD3hTF6kO58rU6ZJ6AuUpkAw8b8ifH0A"],["선교편지용 사진","Mission Newsletter Photos","N9M75ig_j3dOiZHBMAm7a770e7Pc7VmhnBZhY"],["2024년 유학생 사역","2024 International Student Ministry","Mx7e14f4XLWrC4sFsb8x4HRacuUGj8xiuez2k"]];

function albumLink(index){
 const [ko,en,id]=aboutAlbums[index];
 return '<p><a target="_blank" rel="noopener noreferrer" href="https://photos.google.com/album/AF1Qip'+id+'">'+t(ko,en)+' ↗</a></p>';
}
function aboutCards(){
 return '<div class="cards">'+aboutItems.map(([ko,en,copyKo,copyEn,route,labelKo,labelEn],index)=>'<article class="card"><h3>'+t(ko,en)+'</h3><p>'+t(copyKo,copyEn)+'</p>'+(index<2?albumLink(index):'')+(route?button(route,t(labelKo,labelEn),true):'')+'</article>').join('')+'</div><div class="card" style="margin-top:16px"><h3>'+t('활동 사진 앨범','Activity photo albums')+'</h3><p>'+t('앨범에서 활동 기록을 더 볼 수 있습니다.','Browse more activity photos in the albums.')+'</p>'+albumLink(2)+albumLink(3)+'</div>';
}

 ['join',t(...menu.join),t('봉사, 교회·대학 협력, 후원 방법을 알아보세요.','Explore volunteering, partnerships and ways to support the center.')]
 ].map(([route,title,copy])=>'<article class="card"><h3><a href="#'+route+'">'+title+' →</a></h3><p>'+copy+'</p></article>').join('')+'</div>');

 (scheduled.length?'<div class="cards">'+scheduled.map(id=>'<article class="card"><h3>'+name(id)+'</h3>'+details(id)+'</article>').join('')+'</div>':
 '<p>'+t('확정된 모임 일정이 준비 중입니다. 관심 있는 프로그램에서 다음 일정을 문의할 수 있습니다.','Confirmed dates are being prepared. Choose a program to ask when it will meet next.')+'</p>'+button('programs',t('프로그램별 일정 보기','Check program dates'),true))+'</div></section>';
