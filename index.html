<script>
const main=document.querySelector('#main');
let english=false;
let draft={name:'',contact:'',program:''}, checked=false;
const t=(ko,en)=>english?en:ko;
const menu={about:['센터 소개','About'],programs:['프로그램','Programs'],chapel:['국제채플','International Chapel'],news:['소식·일정','News & Events'],join:['함께하기','Get Involved'],support:['후원','Support'],contact:['문의·오시는 길','Contact & Directions']};
const programs={

 living:['한국 생활 안내','Life in Korea','대전에서의 생활과 학교 적응에 필요한 정보를 나눕니다.','Share practical information about student life and getting settled in Daejeon.'],
 culture:['문화교류','Cultural Exchange','명절과 음식을 나누고 함께 여행하며 서로의 문화를 배웁니다.','Share holiday traditions and food, take trips and learn about each other’s cultures.'],
 campus:['캠퍼스 만남','Campus Meetups','대전 지역 캠퍼스에서 학생들과 만나 교류합니다.','Meet fellow students on campuses around Daejeon.'],
 chapel:['국제채플','International Chapel','예배, 소그룹, 성경공부에 자율적으로 참여할 수 있습니다.','You are welcome to join worship, small groups and Bible study. Participation is optional.']
};
const name=(id)=>t(...programs[id].slice(0,2));
const desc=(id)=>t(...programs[id].slice(2));
const verify=()=>t('확인 필요','To be confirmed');
const openToAll=()=>t('한국어와 문화교류 프로그램은 종교와 관계없이 참여할 수 있습니다.','Korean language and cultural exchange programs are open to people of all faiths and none.');
const first=()=>t('첫 방문 문의','Ask about a first visit');
const note=()=>t('내부 검토용 시안 · 실제 신청과 문의는 연결 준비 중입니다.','Internal preview · Registration and inquiries will be available once connected.');
const button=(url,label,alt=false)=>'<a class="btn '+(alt?'alt':'')+'" href="#'+url+'">'+label+'</a>';
const section=(title,body)=>'<section class="wrap section"><h2>'+title+'</h2>'+body+'</section>';
const photo=(caption)=>'<figure><div class="photo"><div><b>'+t('활동 사진 준비 중','Activity photo pending')+'</b><small>'+t('게시 동의 확인 후 삽입','Photo will be added after publication consent is confirmed')+'</small></div></div><figcaption>'+caption+'</figcaption></figure>';
const facts=(items)=>'<dl>'+items.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>';
// Set status to open or closed after the event details are verified.
const events={};
function details(id){
 const event=events[id]||{};
 const status=event.status||'pending';
 const label={open:t('모집 중','Open'),closed:t('마감','Closed'),pending:t('일정 미정','Schedule pending')}[status];
 const action=status==='closed'?'<button class="btn alt" disabled>'+label+'</button>':button('visit/'+id,status==='open'?t('참가 신청','Register'):t('다음 일정 문의','Ask about the next date'));

function albumLink(index){
 const [ko,en,id]=aboutAlbums[index];

function aboutCards(){

function supportSection(onHome){
 const title=t('유학생의 한국 생활을 함께 응원해 주세요','Help international students feel at home');
 const intro=t('한국어를 연습하고, 한국 문화를 경험하고, 새로운 친구를 만나는 자리에 힘을 보태 주세요.','Help create opportunities for students to practice Korean, experience Korean culture and make new friends.');
 const details=t('정기 후원, 일시 후원 또는 행사 물품 지원에 관심이 있다면 후원 문의 양식을 확인해 주세요.','If you are interested in recurring support, a one-time gift or event supplies, see the support inquiry form.');
 const action=button(onHome?'support':'visit/support',t(onHome?'후원 안내 보기':'후원 문의 양식 보기',onHome?'Support information':'View support inquiry form'));
