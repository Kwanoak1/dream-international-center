<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>활동사진 관리 | 드림국제교류센터</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#142e39;font:16px/1.6 "Malgun Gothic",sans-serif}main{width:min(620px,92%);margin:40px auto}section{background:white;border:1px solid #dcded3;border-radius:16px;padding:22px}h1{margin-bottom:8px}a{color:#176b65}label{display:block;margin-bottom:14px;font-weight:bold}input,select{display:block;width:100%;margin-top:5px;padding:8px;font:inherit}button{background:#176b65;color:white;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.6}
</style></head><body><main>
<a href="index.html#news">← 소식·일정으로 돌아가기</a>
<h1>활동사진 관리</h1>
<section>
<form id="login" hidden><label>로그인 구분<select name="role"><option value="admin">관리자</option><option value="member">회원</option></select></label><label id="memberUsername" hidden>회원 아이디<input name="username" autocomplete="username" maxlength="32"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form>
<p id="currentRole" hidden></p>
<p id="galleryLink" hidden><a href="index.html#news">활동사진 보기</a></p>
<p id="memberManagement" hidden><a href="members.html">회원관리 페이지 열기</a></p>
<form id="upload" hidden><label>사진 제목<input name="title" required maxlength="80"></label><label>활동사진<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><p>JPG, PNG, WebP 사진을 등록할 수 있습니다.</p><button>사진 올리기</button></form>
<button id="logout" type="button" hidden>로그아웃</button>
<p id="message" role="status"></p>
</section></main><script src="activity.js"></script></body></html>
